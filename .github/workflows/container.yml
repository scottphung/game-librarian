# Run the tests on SQLite and on PostgreSQL, then publish the container image to the GitHub Container Registry
# (ghcr.io/<owner>/<repository>) for Azure Container Apps. A pull request is tested but publishes nothing.
# The image is tagged with the commit (sha-1a2b3c4) and, on the default branch, "latest". See DEPLOYMENT.md.
name: Test and publish the container image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gl_test
          POSTGRES_PASSWORD: gl_test_only  # a throwaway password of this job's own test server, not a secret
          POSTGRES_DB: gl_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gl_test" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Tests on SQLite
        run: python -m pytest -q
      - name: Tests on PostgreSQL
        env:
          GAME_LIBRARIAN_TEST_DATABASE_URL: postgresql://gl_test@127.0.0.1:5432/gl_test
          PGPASSWORD: gl_test_only
        run: python -m pytest -q

  publish:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # GITHUB_TOKEN may push this repository's own image; no other secret is needed
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: game-librarian-web-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check this is still the latest commit
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq '.object.sha')
          if [ "$current" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Skipping an older commit; a newer push will deploy."
          fi
      - name: Sign in to Azure
        if: steps.head.outputs.deploy == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy published image
        if: steps.head.outputs.deploy == 'true'
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA:0:7}"
          az containerapp update --name game-librarian-web --resource-group reagan-test \
            --container-name game-librarian-web --image "$image" --output none
          revision=$(az containerapp show --name game-librarian-web --resource-group reagan-test \
            --query properties.latestRevisionName -o tsv)
          echo "Waiting for revision $revision"
          for attempt in {1..60}; do
            state=$(az containerapp revision show --name game-librarian-web --resource-group reagan-test \
              --revision "$revision" --query properties.runningState -o tsv)
            echo "Revision status: $state"
            if [ "$state" = "Running" ] || [ "$state" = "RunningAtMaxScale" ] || [ "$state" = "ScaledToZero" ]; then
              exit 0
            fi
            if [ "$state" = "ActivationFailed" ] || [ "$state" = "Degraded" ]; then
              exit 1
            fi
            sleep 10
          done
          echo "Revision did not become ready in time."
          exit 1
      - name: Update the scheduled sync image
        if: steps.head.outputs.deploy == 'true'
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA:0:7}"
          az containerapp job update --name game-librarian-sync --resource-group reagan-test \
            --container-name game-librarian-sync --image "$image" --output none
